name: Nexus Video Render

on:
  repository_dispatch:
    types: [render_video]

jobs:
  build_video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          pip install requests pydub gTTS edge-tts

      - name: Run Render Script
        env:
          # Payload desde Render
          SCENES_JSON: ${{ toJson(github.event.client_payload.scenes) }}
          METADATA_JSON: ${{ toJson(github.event.client_payload.metadata) }}
          
          # Credenciales base (Telegram y Pixabay de respaldo)
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          
          # Motor de Video IA (Prezzy) - Se queda por si acaso
          PREZZY_BASE_URL: ${{ secrets.PREZZY_BASE_URL }}
          
          # NUEVO Motor de Imagen IA (FLUX) - El que usaremos ahora
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          
        run: python render_worker.py
